[package]
name = "trame-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "GPL-3.0-only"

[lib]
crate-type = ["staticlib", "rlib", "cdylib"]

[dependencies]
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = { version = "2.5", features = ["serde"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
